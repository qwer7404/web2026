<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[이승은]-사용자 등록 신청서</title>
    <style>
        body {
            background-color:whitesmoke

        }
    </style>
</head>
<body>
    <div style="margin-left: 20px;">
        <h1>사용자 등록 신청서</h1>
    </div>
        <style>
            form{
                background-color:white;
                width: 700px;
                padding: 20px;
                align-items : center;
                margin-left: 20px;
            }
            .mybtns{
                display: flex;
                justify-content: center;
                gap: 10px;
            }

        </style>
    <form>

        <fieldset>
            <legend>기본 정보(Essential)</legend>
            <label for="name">아이디:</label><br>
            <input type="text" id="name" name="name" required  placeholder="4-12자 영문/숫자" style="width: 100%; box-sizing: border-box;"><br><br>

            <label for="password">비밀번호:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; box-sizing: border-box;""><br><br>

            <label for="email">이메일:</label><br>
            <input type="email" id="email" name="email" required style="width: 100%; box-sizing: border-box;""><br><br>
        </fieldset>
        <p></p>
        <p></p>
        <fieldset>
            <legend>부가 정보(Optional)</legend>
            <label for="phone">연락처:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}" style="width: 100%; box-sizing: border-box;"><br><br>

            <label for="address">관심분야:</label><br>
            <input type="checkbox" id="HTML5" name="interests" value="HTML5">
            <label for="HTML5">HTML5</label>

            <input type="checkbox" id="CSS3" name="interests" value="CSS3">
            <label for="CSS3">CSS3</label>

            <input type="checkbox" id="JavaScript" name="interests" value="JavaScript">
            <label for="JavaScript">JavaScript</label><br><br>

            <label for="step">숙련도:</label><br>
            <input type="range" id="step" name="step" min="1" max="10" step="1">

        </fieldset>
        <p></p>
        <div class="mybtns">
        <input type="button" value="가입신청">
        <input type="reset" value="초기화">
        </div>




    </form>
    <p></p>
    <a href="index.html">홈으로</a>
    <p>ⓒ 2026 Web programming Course. All rights reserved.</p>

</body>
</html>
